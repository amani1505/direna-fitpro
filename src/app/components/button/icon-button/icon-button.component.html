<button
  [ngClass]="[colorClasses, sizeClasses, rounded ? 'rounded-full' : 'rounded-lg']"
  matRipple
  type="button"
  class="flex h-5 w-5 items-center justify-center capitalize transition duration-200 ease-spring hover:scale-110 active:scale-90"
  (click)="click()"
>
  <svg-icon src="{{ icon }}" [svgClass]="iconSize"> </svg-icon>
</button>
