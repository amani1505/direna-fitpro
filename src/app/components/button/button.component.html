<button
  [ngClass]="[colorClasses, sizeClasses, rounded ? 'rounded-full' : 'rounded-xl']"
  matRipple
  class="relative w-full select-none overflow-hidden font-display font-bold capitalize transition-[transform,background-color,color,box-shadow] duration-200 ease-out-expo active:scale-[0.97] disabled:pointer-events-none disabled:opacity-50"
  (click)="click()"
>
  <ng-content></ng-content>
</button>
