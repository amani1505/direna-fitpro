<div class="relative inline-block w-full text-left">
  <!-- Dropdown Button -->
  <button
    (click)="toggleDropdown()"
    [attr.aria-labelledby]="labelledBy || null"
    aria-haspopup="listbox"
    [attr.aria-expanded]="dropdownOpenSignal()"
    clickOutside
    (clickOutside)="closeDropdown()"
    type="button"
    class="field"
  >
    <div class="flex min-w-0 flex-wrap gap-1">
      @if (selectedOptionDetails().length > 0) {
        @for (option of selectedOptionDetails(); track option.value) {
          <div
            class="flex animate-pop-in items-center gap-1 rounded-full bg-primary-500/10 py-0.5 pl-2.5 pr-1 text-xs font-semibold text-primary-700 dark:text-primary-300"
          >
            <div>{{ option.label }}</div>
            <!-- Mouse shortcut; options can also be removed from the list. -->
            <div aria-hidden="true"
              (click)="removeOption(option.value, $event)"
              class="grid h-4 w-4 place-items-center rounded-full text-sm leading-none transition hover:bg-primary-500 hover:text-white"
            >
              &times;
            </div>
          </div>
        }
      } @else {
        <span class="text-subtle">{{ placeholder }}</span>
      }
    </div>
    <svg-icon
      src="assets/icons/heroicons/solid/chevron-down.svg"
      [svgClass]="
        'h-4 w-4 shrink-0 text-subtle transition-transform duration-300'
      "
      [class.rotate-180]="dropdownOpenSignal()"
    ></svg-icon>
  </button>

  <!-- Dropdown Menu -->
  @if (dropdownOpenSignal()) {
    <div class="dropdown-panel">
      <!-- Search Input -->
      <input
        type="text"
        (input)="onSearchChange($event)"
        (click)="$event.stopPropagation()"
        placeholder="Search..."
        class="!rounded-lg !py-2 text-sm"
      />
      <div class="mt-1.5 max-h-56 overflow-y-auto" role="listbox" aria-multiselectable="true">
        @if (filteredOptions().length > 0) {
          @for (option of filteredOptions(); track option.value) {
            <div role="option" tabindex="0" [attr.aria-selected]="selectedValuesSignal().includes(option.value)" (keydown.enter)="$any($event.currentTarget).click()" (keydown.space)="$event.preventDefault(); $any($event.currentTarget).click()"
              (click)="selectOption(option); $event.stopPropagation()"
              class="dropdown-option"
              [class.dropdown-option-active]="
                selectedValuesSignal().includes(option.value)
              "
            >
              {{ option.label }}
            </div>
          }
        } @else {
          <div class="px-3 py-4 text-center text-sm text-muted">
            There are no options
          </div>
        }
      </div>
      @if (canAdd) {
        <div>
          <button (click)="add()" type="button" class="dropdown-add">
            <div>
              <svg-icon
                src="./assets/icons/heroicons/solid/plus-circle.svg"
                [svgClass]="'w-4 h-4'"
                class="inline-block"
              >
              </svg-icon>
            </div>
            <div>{{ buttonLabel }}</div>
          </button>
        </div>
      }
    </div>
  }
</div>

@if (isTouchedSignal() && !isValid()) {
  <div class="is__invalid-error">Please select at least one option.</div>
}
