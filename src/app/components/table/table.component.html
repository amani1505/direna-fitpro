<div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
  <div class="min-w-0">
    <h3 class="font-display text-2xl font-extrabold capitalize tracking-tight text-ink sm:text-3xl">
      {{ title }}
    </h3>
    <p class="mt-1 flex items-center gap-2 text-sm text-muted">
      <span class="capitalize">{{ totalTitle }}</span>
      <span class="rounded-full bg-primary-500/10 px-2 py-0.5 font-display text-xs font-bold text-primary-600 dark:text-primary-400">{{ totalValue }}</span>
    </p>
  </div>

  <button
    type="button"
    (click)="add()"
    class="btn-pop shine w-full !px-5 !py-2.5 text-sm capitalize sm:w-auto"
  >
    <span aria-hidden="true" class="text-lg leading-none">+</span>
    {{ buttonLabel }}
  </button>
</div>

<div class="flex min-w-0 flex-col overflow-hidden rounded-2xl border border-line bg-surface animate-fade-in-up">
  <TableActions [actions]="actions"></TableActions>
  <div class="min-w-0 grow overflow-x-auto">
    <table class="w-full min-w-max border-collapse text-left align-middle text-sm text-ink">
      <thead class="bg-surface-2 text-xs text-muted">
        <tr
          app-table-header
          (onCheckAll)="toggleAll($event)"
          [columns]="headerColumns"
        ></tr>
      </thead>
      <tbody>
        @for (row of data; track $index) {
          <tr
            table-row
            [index]="$index + 1"
            [data]="row"
            [columns]="rowColumns"
            (onCheck)="toggle($event.checked, row)"
            (onDelete)="deleteModal(row.id)"
            (onUpdate)="update(row.id)"
            (onView)="view(row.id)"
            class="table-row-anim transition-colors duration-150 hover:bg-surface-2/60"
            [style.animation-delay.ms]="$index * 30"
          ></tr>
        }
      </tbody>
    </table>
  </div>
  @if (!data?.length) {
    <div class="flex h-48 flex-col items-center justify-center gap-2 px-4 text-center text-muted">
      <span class="grid h-12 w-12 animate-pop-in place-items-center rounded-full bg-surface-2 font-display text-xl text-subtle" aria-hidden="true">✺</span>
      <p class="font-display font-bold text-ink">Nothing here yet</p>
      <p class="text-sm">Use the button above to add the first one.</p>
    </div>
  }
  <TableFooter
    (pageChange)="onPageChange($event)"
    (itemsPerPageChange)="onItemsPerPageChange($event)"
    [itemsPerPage]="itemsPerPage"
    [totalItems]="totalItems"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
  ></TableFooter>
</div>

<Modal
  [isOpen]="isModalOpen()"
  (closeModalEvent)="closeModal()"
  [title]="'Delete Confirmation'"
  [content]="deleteContent"
  [subContent]="deleteSubContent"
  (submit)="delete()"
></Modal>
