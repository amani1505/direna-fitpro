<div
  class="flex flex-col-reverse items-center justify-between gap-3 px-4 py-3 text-xs text-muted sm:flex-row"
>
  <!-- Show per page section -->
  <div class="flex items-center gap-2">
    Show
    <select
      class="!w-20 !rounded-lg !py-1.5 !pl-3 !pr-7 text-xs"
      [(ngModel)]="itemsPerPage"
      (change)="onItemsPerPageChange()"
    >
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="20">20</option>
      <option value="30">30</option>
      <option value="50">50</option>
    </select>
    per page
  </div>

  <!-- Pagination controls -->
  <div class="flex flex-wrap items-center justify-center gap-3">
    <span class="font-semibold text-ink"
      >{{ startItem }}–{{ endItem }}
      <span class="font-normal text-muted">of {{ totalItems }}</span></span
    >
    <div class="inline-flex items-center gap-1">
      <!-- Previous Button -->
      <button
        type="button"
        class="grid h-8 w-8 flex-shrink-0 place-items-center rounded-full text-ink transition hover:bg-surface-2 active:scale-90 disabled:pointer-events-none disabled:opacity-40"
        [disabled]="currentPage === 1"
        (click)="goToPreviousPage()"
      >
        <svg-icon
          src="./assets/icons/heroicons/outline/arrow-long-left.svg"
          [svgClass]="'h-4 w-4'"
        >
        </svg-icon>
      </button>

      <!-- Page Numbers -->
      @for (page of visiblePages; track page) {
        <button
          type="button"
          class="grid h-8 min-w-8 flex-shrink-0 place-items-center rounded-full px-2 font-display text-sm font-bold transition duration-200 ease-spring active:scale-90"
          [ngClass]="
            page === currentPage
              ? 'scale-105 bg-primary-500 text-white shadow-glow'
              : 'text-ink hover:bg-surface-2'
          "
          [attr.aria-current]="page === currentPage ? 'page' : null"
          (click)="goToPage(+page)"
        >
          {{ page }}
        </button>
      }

      <!-- Next Button -->
      <button
        type="button"
        class="grid h-8 w-8 flex-shrink-0 place-items-center rounded-full text-ink transition hover:bg-surface-2 active:scale-90 disabled:pointer-events-none disabled:opacity-40"
        [disabled]="currentPage === totalPages"
        (click)="goToNextPage()"
      >
        <svg-icon
          src="./assets/icons/heroicons/outline/arrow-long-right.svg"
          [svgClass]="'h-4 w-4'"
        >
        </svg-icon>
      </button>
    </div>
  </div>
</div>
