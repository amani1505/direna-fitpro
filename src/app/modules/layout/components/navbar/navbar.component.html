<header class="relative z-20 border-b border-line bg-surface/80 backdrop-blur-xl">
  <div class="flex h-16 items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
    <div class="flex items-center gap-3">
      <!-- Menu button (below lg, where the sidebar is hidden) -->
      <button
        (click)="toggleMobileMenu()"
        type="button"
        class="grid h-10 w-10 place-items-center rounded-xl border border-line bg-surface text-ink transition hover:border-primary-500 hover:text-primary-500 active:scale-90 lg:hidden"
        aria-label="Open menu"
      >
        <svg-icon src="assets/icons/heroicons/outline/menu.svg" [svgClass]="'h-5 w-5'"></svg-icon>
      </button>

      <!-- Logo (below lg) -->
      <a routerLink="/admin" class="group flex items-center gap-2 lg:hidden">
        <span class="grid h-9 w-9 place-items-center rounded-xl border-2 border-ink bg-primary-500 shadow-pop-sm transition-transform duration-500 ease-spring group-hover:-rotate-12">
          <svg-icon src="assets/images/logo-icon-white.svg" [svgClass]="'h-4 w-4'"></svg-icon>
        </span>
        <span class="hidden font-display text-base font-extrabold tracking-tight text-ink xs:block">
          direna<span class="text-primary-500">fitpro</span>
        </span>
      </a>
    </div>

    <div class="flex items-center gap-2">
      <app-theme-toggle></app-theme-toggle>
      <app-profile-menu></app-profile-menu>
    </div>
  </div>

  <!-- Mobile menu -->
  <app-navbar-mobile></app-navbar-mobile>
</header>
