<div class="relative">
  <!-- Profile Button -->
  <button
    (click)="toggleMenu()"
    class="relative flex rounded-full p-0.5 ring-2 ring-primary-500/60 transition hover:ring-primary-500 active:scale-95"
    type="button"
    aria-expanded="false"
    aria-haspopup="true"
  >
    <span class="sr-only">Open user menu</span>
    <img
      clickOutside
      (clickOutside)="isMenuOpen = false"
      class="h-9 w-9 rounded-full object-cover"
      src="https://avatars.githubusercontent.com/u/12519008?v=4"
      alt=""
    />
  </button>
  <!-- Dropdown -->
  <div
    [ngClass]="
      isMenuOpen
        ? 'pointer-events-auto scale-100 animate-fade-in-up opacity-100 duration-200 z-10'
        : 'pointer-events-none scale-95 opacity-0 duration-100 ease-in'
    "
    class="absolute right-0 mt-3 w-64 origin-top-right transform rounded-2xl border border-line bg-surface py-4 shadow-custom transition focus:outline-none"
  >
    <div class="flext-row flex items-center px-4 pb-4">
      <div class="w-10 shrink-0">
        <img
          class="rounded-full"
          src="https://avatars.githubusercontent.com/u/12519008?v=4"
          alt=""
        />
      </div>
      <div
        class="overflow-hidden px-2 text-sm font-semibold text-gray-700 dark:text-night-50"
      >
        Luciano Oliveira
        <p
          class="truncate text-ellipsis text-xs font-semibold text-gray-400 dark:text-night-300"
        >
          email.dev
        </p>
      </div>
    </div>

    <div
      class="border-b border-dashed border-line"
    ></div>

    <ul class="my-2 mx-4">
      <li
        class="block cursor-pointer rounded-xl px-3 py-2 text-sm font-semibold text-ink transition hover:translate-x-0.5 hover:bg-surface-2 hover:text-primary-500"
      >
        Your Profile
      </li>
      <li
        class="block cursor-pointer rounded-xl px-3 py-2 text-sm font-semibold text-ink transition hover:translate-x-0.5 hover:bg-surface-2 hover:text-primary-500"
      >
        Language
      </li>
      <li
        class="block cursor-pointer rounded-xl px-3 py-2 text-sm font-semibold text-ink transition hover:translate-x-0.5 hover:bg-surface-2 hover:text-primary-500"
      >
        Settings
      </li>
      <li
        routerLink="/auth"
        class="block cursor-pointer rounded-xl px-3 py-2 text-sm font-semibold text-ink transition hover:translate-x-0.5 hover:bg-surface-2 hover:text-primary-500"
      >
        Sign out
      </li>
    </ul>
  </div>
</div>
