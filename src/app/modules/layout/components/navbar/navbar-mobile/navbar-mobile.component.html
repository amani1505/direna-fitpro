<!-- Backdrop -->
<div
  class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm transition-opacity duration-300 lg:hidden"
  [ngClass]="menuService.showMobileMenu ? 'opacity-100' : 'pointer-events-none opacity-0'"
  (click)="toggleMobileMenu()"
  aria-hidden="true"
></div>

<!-- Drawer -->
<aside
  class="fixed inset-y-0 left-0 z-50 flex w-[min(20rem,86vw)] flex-col border-r border-line bg-surface shadow-2xl transition-transform duration-500 ease-out-expo lg:hidden"
  [ngClass]="menuService.showMobileMenu ? 'translate-x-0' : 'pointer-events-none -translate-x-full'"
  [attr.aria-hidden]="!menuService.showMobileMenu"
  aria-label="Menu"
>
  <div class="flex h-16 items-center justify-between border-b border-line px-4">
    <div class="flex items-center gap-2">
      <span class="grid h-9 w-9 place-items-center rounded-xl border-2 border-ink bg-primary-500 shadow-pop-sm">
        <svg-icon src="assets/images/logo-icon-white.svg" [svgClass]="'h-4 w-4'"></svg-icon>
      </span>
      <b class="font-display text-base font-extrabold tracking-tight text-ink">
        direna<span class="text-primary-500">fitpro</span>
      </b>
    </div>
    <button
      (click)="toggleMobileMenu()"
      type="button"
      class="grid h-9 w-9 place-items-center rounded-full bg-surface-2 text-ink transition hover:rotate-90 hover:bg-primary-500 hover:text-white active:scale-90"
      aria-label="Close menu"
    >
      <svg-icon src="assets/icons/heroicons/outline/x.svg" [svgClass]="'h-5 w-5'"></svg-icon>
    </button>
  </div>
  <div class="grow overflow-y-auto px-4 pb-6">
    <app-navbar-mobile-menu></app-navbar-mobile-menu>
  </div>
</aside>
