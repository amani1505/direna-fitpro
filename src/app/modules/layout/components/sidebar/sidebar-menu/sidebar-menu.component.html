@for (menu of menuService.pagesMenu; track menu) {
  <div class="pt-5">
    <p
      class="mb-2 px-2.5 text-xs font-semibold text-subtle transition-opacity duration-200"
      [ngClass]="{ 'h-0 overflow-hidden opacity-0': !menuService.showSideBar }"
    >
      {{ menu.group }}
    </p>
    <ul class="flex flex-col gap-1">
      @for (item of menu.items; track item) {
        <li>
          <div role="button" tabindex="0" [attr.aria-expanded]="!!item.expanded" (keydown.enter)="$any($event.currentTarget).click()" (keydown.space)="$event.preventDefault(); $any($event.currentTarget).click()"
            (click)="toggleMenu(item)"
            class="menu-row group relative text-muted"
          >
            <!-- Icon -->
            <div
              [ngClass]="
                item.active && !menuService.showSideBar
                  ? 'text-primary-500'
                  : ''
              "
              class="menu-icon pointer-events-none absolute left-2.5 top-2.5 transition-transform duration-300 ease-spring group-hover:scale-110 group-hover:-rotate-6"
            >
              <svg-icon src="{{ item.icon }}" [svgClass]="'h-5 w-5'"></svg-icon>
            </div>
            <ng-container
              [ngTemplateOutlet]="item.children ? childMenu : parentMenu"
              [ngTemplateOutletContext]="{ item: item }"
            >
            </ng-container>
            <!-- Workaround:: Enable routerLink -->
            <ng-template #parentMenu let-item="item">
              <div
                routerLink="{{ item.route }}"
                routerLinkActive="nav-item-active"
                [routerLinkActiveOptions]="{ exact: true }"
                class="nav-item flex h-10 cursor-pointer items-center rounded-xl hover:bg-surface-2 hover:text-ink"
              >
                <a
                  class="ml-10 truncate text-sm font-semibold capitalize focus:outline-none"
                  [ngClass]="{ 'sr-only': !menuService.showSideBar }"
                >
                  {{ item.label }}
                </a>
              </div>
            </ng-template>
            <!-- Workaround:: Disable routerLink -->
            <ng-template #childMenu let-item="item">
              <div
                class="nav-item flex h-10 cursor-pointer items-center rounded-xl hover:bg-surface-2 hover:text-ink"
                [class.nav-item-active]="item.active"
              >
                <a
                  class="ml-10 truncate text-sm font-semibold capitalize focus:outline-none"
                  [ngClass]="{ 'sr-only': !menuService.showSideBar }"
                >
                  {{ item.label }}
                </a>
              </div>
            </ng-template>
            <!-- Arrow Icon -->
            @if (item.children) {
              <button
                type="button"
                tabindex="-1"
                [ngClass]="{
                  hidden: !menuService.showSideBar,
                  'rotate-90': item.expanded,
                }"
                class="pointer-events-none absolute right-1 top-2 flex items-center p-1 text-subtle transition-transform duration-300 ease-spring"
              >
                <svg-icon
                  src="assets/icons/heroicons/solid/chevron-right.svg"
                  [svgClass]="'h-4 w-4'"
                ></svg-icon>
              </button>
            }
            <!-- Tooltip (collapsed sidebar) -->
            @if (!menuService.showSideBar) {
              <span class="sidebar-tip-anchor">
                <span class="sidebar-tip capitalize">{{ item.label }}</span>
              </span>
            }
          </div>
          <!-- Submenu items -->
          <app-sidebar-submenu [submenu]="item"></app-sidebar-submenu>
        </li>
      }
    </ul>
    @if (menu.separator) {
      <div class="mx-2.5 mt-4 border-t border-dashed border-line"></div>
    }
  </div>
}
