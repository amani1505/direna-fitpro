<nav
  [ngClass]="menuService.showSideBar ? 'w-56 xl:w-64' : 'w-[76px]'"
  class="hidden h-full shrink-0 flex-col justify-between overflow-y-auto overflow-x-hidden border-r border-line bg-surface pt-4 transition-[width] duration-300 ease-out-expo lg:flex"
  aria-label="Admin"
>
  <div class="px-3">
    <!-- Logo -->
    <div class="relative flex h-11 items-center">
      <a
        routerLink="/admin"
        class="group flex items-center gap-2.5 overflow-hidden"
        aria-label="Dashboard home"
      >
        <span
          class="grid h-10 w-10 shrink-0 place-items-center rounded-2xl border-2 border-ink bg-primary-500 shadow-pop-sm transition-transform duration-500 ease-spring group-hover:-rotate-12"
        >
          <svg-icon
            src="assets/images/logo-icon-white.svg"
            [svgClass]="'h-5 w-5'"
          ></svg-icon>
        </span>
        <span
          class="whitespace-nowrap font-display text-lg font-extrabold tracking-tight text-ink transition-opacity duration-200"
          [ngClass]="
            menuService.showSideBar
              ? 'opacity-100'
              : 'pointer-events-none opacity-0'
          "
        >
          direna<span class="text-primary-500">fitpro</span>
        </span>
      </a>
      <button
        type="button"
        (click)="toggleSidebar()"
        class="absolute -right-1 top-1/2 grid h-7 w-7 -translate-y-1/2 place-items-center rounded-full border border-line bg-surface text-subtle transition-all duration-300 hover:border-primary-500 hover:text-primary-500"
        [ngClass]="{ 'rotate-180 !-right-0.5': !menuService.showSideBar }"
        [attr.aria-label]="
          menuService.showSideBar ? 'Collapse sidebar' : 'Expand sidebar'
        "
      >
        <svg-icon
          src="assets/icons/heroicons/solid/chevron-double-left.svg"
          [svgClass]="'h-4 w-4'"
        ></svg-icon>
      </button>
    </div>

    <!-- Menu Items -->
    <app-sidebar-menu></app-sidebar-menu>
  </div>

  <div class="m-3 space-y-1 border-t border-line pt-3">
    <!-- Theme -->
    <button
      type="button"
      (click)="toggleTheme($event)"
      class="group nav-item flex h-10 w-full items-center gap-3 rounded-xl px-2.5 text-muted hover:bg-surface-2 hover:text-ink"
      [attr.aria-label]="
        themeService.isDark ? 'Switch to light mode' : 'Switch to dark mode'
      "
    >
      <span
        class="grid h-5 w-5 shrink-0 place-items-center transition-transform duration-500 ease-spring group-hover:rotate-[25deg]"
      >
        <svg-icon
          [src]="
            themeService.isDark
              ? 'assets/icons/heroicons/solid/sun.svg'
              : 'assets/icons/heroicons/solid/moon.svg'
          "
          [svgClass]="'h-5 w-5'"
          [ngClass]="
            themeService.isDark ? 'text-yellow-400' : 'text-secondary-500'
          "
        ></svg-icon>
      </span>
      <span
        class="truncate text-sm font-semibold"
        [ngClass]="{ 'sr-only': !menuService.showSideBar }"
      >
        {{ themeService.isDark ? "Light mode" : "Dark mode" }}
      </span>
      @if (!menuService.showSideBar) {
        <span class="sidebar-tip-anchor"
          ><span class="sidebar-tip">Theme</span></span
        >
      }
    </button>

    <!-- Sign out -->
    <a
      routerLink="/signout"
      class="group nav-item relative flex h-10 w-full items-center gap-3 rounded-xl px-2.5 text-muted hover:bg-primary-500/10 hover:text-primary-500"
    >
      <svg-icon
        src="assets/icons/heroicons/solid/logout.svg"
        [svgClass]="
          'h-5 w-5 shrink-0 transition-transform duration-300 group-hover:translate-x-0.5'
        "
      ></svg-icon>
      <span
        class="truncate text-sm font-semibold"
        [ngClass]="{ 'sr-only': !menuService.showSideBar }"
        >Sign out</span
      >
      @if (!menuService.showSideBar) {
        <span class="sidebar-tip-anchor"
          ><span class="sidebar-tip">Sign out</span></span
        >
      }
    </a>
  </div>
</nav>
