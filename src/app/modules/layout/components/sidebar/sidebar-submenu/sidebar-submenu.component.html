<div
  class="max-h-0 overflow-hidden pt-1 pl-4 transition-all duration-500"
  [ngClass]="{
    hidden: !menuService.showSideBar,
    'max-h-screen': submenu.expanded,
  }"
>
  <ul
    class="ml-2 flex flex-col gap-0.5 border-l-2 border-dashed border-line pl-2"
  >
    @for (sub of submenu.children; track sub) {
      <li>
        <div
          class="flex rounded-lg text-muted transition-colors hover:bg-surface-2 hover:text-ink"
          (click)="toggleMenu(sub)"
        >
          <!-- Condition -->
          <ng-container
            [ngTemplateOutlet]="sub.children ? childMenu : parentMenu"
            [ngTemplateOutletContext]="{ sub: sub }"
          >
          </ng-container>
          <!-- Parent Menu -->
          <ng-template #parentMenu let-sub="sub">
            <a
              [routerLink]="sub.route"
              routerLinkActive="text-primary-500"
              [routerLinkActiveOptions]="{ exact: true }"
              class="inline-block w-full px-4 py-2 text-[13px] font-medium capitalize transition-transform duration-200 hover:translate-x-0.5"
            >
              {{ sub.label }}
            </a>
          </ng-template>
          <!-- Child Menu -->
          <ng-template #childMenu let-sub="sub">
            <a
              class="inline-block w-full cursor-pointer px-4 py-2 text-[13px] font-medium capitalize transition-transform duration-200 hover:translate-x-0.5"
            >
              {{ sub.label }}
            </a>
            <button
              [ngClass]="{
                hidden: !menuService.showSideBar,
                'rotate-90': sub.expanded,
              }"
              class="flex items-center p-1 text-gray-400 transition-all duration-500 dark:text-night-400"
            >
              <svg-icon
                src="assets/icons/heroicons/solid/chevron-right.svg"
                [svgClass]="'h-5 w-5'"
              >
              </svg-icon>
            </button>
          </ng-template>
        </div>
        <!-- Submenu items -->
        <app-sidebar-submenu [submenu]="sub"></app-sidebar-submenu>
      </li>
    }
  </ul>
</div>
