<div class="flex min-h-[100dvh] bg-bg">
  <!-- Visual panel (desktop) -->
  <div
    class="relative m-3 hidden flex-1 overflow-hidden rounded-[2rem] bg-cover bg-center lg:flex"
    style="background-image: url('assets/images/bg.jpg')"
  >
    <div class="absolute inset-0 bg-gradient-to-br from-[rgb(24_19_34/0.92)] via-[rgb(24_19_34/0.6)] to-primary-500/70"></div>
    <div aria-hidden="true" class="absolute -left-20 top-1/4 h-80 w-80 animate-blob rounded-full bg-secondary-500/40 blur-3xl"></div>
    <div aria-hidden="true" class="absolute -bottom-20 right-0 h-80 w-80 animate-blob rounded-full bg-primary-500/40 blur-3xl [animation-delay:-5s]"></div>

    <div class="relative z-10 flex w-full flex-col justify-between p-10 text-white xl:p-14">
      <a routerLink="/" class="group flex w-max items-center gap-2">
        <span class="grid h-10 w-10 place-items-center rounded-full bg-primary-500 transition-transform duration-500 ease-spring group-hover:-rotate-12">
          <svg-icon src="assets/images/logo-icon-white.svg" [svgClass]="'h-5 w-5'"></svg-icon>
        </span>
        <span class="font-display text-xl font-extrabold tracking-tight">direna<span class="text-primary-400">fitpro</span></span>
      </a>

      <div class="max-w-xl">
        <span class="mb-6 inline-flex -rotate-2 animate-pop-in items-center gap-2 rounded-full bg-white/10 px-4 py-1.5 font-display text-sm font-bold backdrop-blur">
          <span class="text-primary-400" aria-hidden="true">✺</span> Start your journey today
        </span>
        <h1 class="animate-rise font-display text-5xl font-extrabold leading-[0.95] tracking-[-0.035em] [animation-delay:100ms] xl:text-6xl">
          Transform your body, elevate your mind
        </h1>
        <p class="mt-6 max-w-lg animate-rise text-base leading-relaxed text-white/75 [animation-delay:220ms]">
          Whether you're here to build muscle, boost endurance or sculpt your dream physique,
          Direna FitPro gives you the tools, training and motivation to get there.
        </p>
      </div>

      <p class="text-sm text-white/50">&copy; Direna FitPro</p>
    </div>
  </div>

  <!-- Form panel -->
  <div class="relative flex flex-1 items-center justify-center px-4 py-16 sm:px-8">
    <div class="absolute right-4 top-4 flex items-center gap-2 sm:right-6 sm:top-6">
      <a
        routerLink="/"
        class="rounded-full px-3 py-2 text-sm font-semibold text-muted transition hover:bg-surface-2 hover:text-ink"
        >Back to site</a
      >
      <app-theme-toggle></app-theme-toggle>
    </div>

    <div class="w-full max-w-xl animate-rise">
      <!-- Logo (mobile) -->
      <a routerLink="/" class="mb-2 flex items-center justify-center gap-2 lg:hidden">
        <span class="grid h-11 w-11 place-items-center rounded-2xl border-2 border-ink bg-primary-500 shadow-pop-sm">
          <svg-icon src="assets/images/logo-icon-white.svg" [svgClass]="'h-5 w-5'"></svg-icon>
        </span>
        <b class="font-display text-xl font-extrabold tracking-tight text-ink">
          direna<span class="text-primary-500">fitpro</span>
        </b>
      </a>

      <router-outlet></router-outlet>
    </div>
  </div>
</div>
