<!-- login form -->
<form class="my-10 space-y-6" [formGroup]="authForm" (ngSubmit)="onSubmit()">
  <div class="text-center">
    <h2 class="mb-2 font-display text-3xl font-extrabold tracking-tight text-ink sm:text-4xl">
      Welcome back
    </h2>
    <p class="text-muted">Sign in with your email and password.</p>
  </div>
  <div class="space-y-6 text-left">
    <div class="space-y-2">
      <label for="email" class="text-sm font-semibold text-ink">Email</label>
      <div class="relative">
        <div
          class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-gray-400"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"
            />
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
          </svg>
        </div>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="w-full py-3 pl-10 pr-4"
          placeholder="your@email.com"
        />
      </div>

      <div *ngIf="authForm.get('email')?.touched">
        <div
          *ngIf="authForm.get('email').hasError('required')"
          class="is__invalid-error"
        >
          Email is Required
        </div>
        <div
          *ngIf="authForm.get('email').hasError('email')"
          class="is__invalid-error"
        >
          Email must be an email address valid
        </div>
      </div>
    </div>

    <div class="space-y-2">
      <div class="flex justify-between">
        <label for="password" class="text-sm font-semibold text-ink"
          >Password</label
        >
        <!-- <a href="#" class="text-xs text-[#ff4836] hover:underline"
          >Forgot Password?</a
        > -->
      </div>
      <div class="relative">
        <div
          class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-gray-400"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <input
          [type]="passwordTextType ? 'text' : 'password'"
          id="password"
          formControlName="password"
          class="w-full py-3 pl-10 pr-4"
          placeholder="••••••••"
        />

        <span
          class="absolute text-gray-400 cursor-pointer top-3 right-5 dark:text-night-300"
          (click)="togglePasswordTextType()"
        >
          <svg-icon
            [src]="
              !passwordTextType
                ? 'assets/icons/heroicons/outline/eye-off.svg'
                : 'assets/icons/heroicons/outline/eye.svg'
            "
            [svgClass]="'h-5  w-5'"
          >
          </svg-icon>
        </span>
      </div>

      <div
        *ngIf="
          authForm.get('password')?.touched &&
          authForm.get('password').hasError('required')
        "
        class="is__invalid-error"
      >
        Password Field is Required
      </div>
    </div>
  </div>
    <!-- Sign-up -->
    <div class="flex flex-wrap justify-center gap-x-2 text-sm text-muted">
      Not a Member or a User yet?
      <a
        routerLink="/auth/sign-up"
        class="font-semibold text-primary-500 underline-offset-4 hover:underline"
        >Register here</a
      >
    </div>

  <!-- Submit Button -->
  <button
    type="submit"
    class="btn-pop shine w-full !py-3.5 text-base disabled:cursor-not-allowed disabled:!translate-x-0 disabled:!translate-y-0 disabled:!border-line disabled:!bg-surface-2 disabled:!text-subtle disabled:!shadow-none"
    [disabled]="authForm.invalid || loading"
  >
    <svg
      *ngIf="loading"
      class="w-5 h-5 mr-3 -ml-1 text-white animate-spin"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
    >
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"
      ></circle>
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
      ></path>
    </svg>

    {{ loading ? "Submitting..." : "Sign in" }}
  </button>


</form>
