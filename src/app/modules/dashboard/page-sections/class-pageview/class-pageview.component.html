<div class="mx-auto">
  <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div class="min-w-0">
      <h3 class="font-display text-2xl font-extrabold tracking-tight text-ink sm:text-3xl">
        Gym schedule
      </h3>
    </div>

    <button
      type="button"
      (click)="addNew()"
      class="btn-pop shine w-full !px-5 !py-2.5 text-sm sm:w-auto"
    >
      <span aria-hidden="true" class="text-lg leading-none">+</span>
      Add class
    </button>
  </div>  @if (classes().length === 0) {
    <div class="flex flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-line px-4 py-14 text-center text-muted">
      <span class="grid h-12 w-12 animate-pop-in place-items-center rounded-full bg-surface-2 font-display text-xl text-subtle" aria-hidden="true">✺</span>
      <p class="font-display font-bold text-ink">No classes scheduled</p>
      <p class="text-sm">Use “Add class” to put the first class on the schedule.</p>
    </div>
  }
  <div>
    <ul
      class="grid grid-cols-1 gap-4 xs:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4"
    >
      @for (class of classes(); track $index) {
        <li class="animate-pop-in" [style.animation-delay.ms]="$index * 60">
          <div class="class-card relative" spotlight>
            <div class="absolute right-3 top-3 z-20 flex gap-1.5">
              <button
                type="button"
                aria-label="Edit class"
                class="grid h-8 w-8 place-items-center rounded-full bg-surface/90 text-blue-600 shadow-soft backdrop-blur transition duration-200 ease-spring hover:scale-110 hover:bg-blue-500 hover:text-white active:scale-90 dark:text-blue-400"
                (click)="updateClass(class.id)"
              >
                <svg-icon
                  src="./assets/icons/heroicons/outline/pencil.svg"
                  [svgClass]="'w-4 h-4'"
                  class="inline-block"
                ></svg-icon>
              </button>
              <button
                type="button"
                aria-label="Delete class"
                class="grid h-8 w-8 place-items-center rounded-full bg-surface/90 text-rose-600 shadow-soft backdrop-blur transition duration-200 ease-spring hover:scale-110 hover:bg-rose-500 hover:text-white active:scale-90 dark:text-rose-400"
                (click)="openDeleteModal(class.id)"
              >
                <svg-icon
                  src="./assets/icons/heroicons/outline/trash.svg"
                  [svgClass]="'w-4 h-4'"
                  class="inline-block"
                ></svg-icon>
              </button>
            </div>
            <figure
              class="card-banner img-holder"
              style="--width: 416; --height: 240"
            >
              <img
                src="{{ fileUrl + class.image }}"
                width="416"
                height="240"
                loading="lazy"
                [alt]="class.name"
                class="img-cover"
              />
            </figure>

            <div class="card-content">
              <div class="flex items-center py-2 gap-x-2">
                <div class="flex items-center justify-center border-r border-line pr-2">
                  <svg-icon
                    src="./assets/icons/heroicons/outline/clock.svg"
                    [svgClass]="'w-6 h-6'"
                    class="text-primary-500"
                    aria-hidden="true"
                  ></svg-icon>
                </div>
                <div class="font-display text-lg font-bold text-ink">
                  {{ class.name }}
                </div>
              </div>


              <p class="line-clamp-3 text-sm text-muted">
                {{ class.description }}
              </p>

              <!-- <div class="card-progress">
              <div class="flex items-center justify-between font-catamaran text-[var(--rich-black-fogra-29-1)]">
                <div class="text-xl font-[800] text-[var(--rich-black-fogra-29-1)] hero-title xl:text-[1.5rem] leading-[1.2]">Class Full</div>

                <div class="text-xl font-[800] text-[var(--rich-black-fogra-29-1)] hero-title xl:text-[1.5rem] leading-[1.2]">{{ class.classFull }}%</div>
              </div>

              <div class="progress-bg">
                <div
                  class="progress-bar"
                  [style.width.%]="class.classFull"
                ></div>
              </div>
            </div> -->
            </div>
          </div>
        </li>
      }
    </ul>
  </div>

<Modal
  [isOpen]="isDeleteModalOpen()"
  (closeModalEvent)="closeDeleteModal()"
  [title]="'Delete Confirmation'"
  [content]="deleteContent"
  [subContent]="deleteSubContent"
  (submit)="delete()"
></Modal>
