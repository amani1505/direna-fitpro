<form [formGroup]="classForm">
  <h3
    class="mb-5 font-display text-2xl font-extrabold capitalize tracking-tight text-ink sm:text-3xl"
  >
    Add new Class
  </h3>
  <div class="mb-3">
    <image-uploader
      [width]="'100%'"
      [height]="'200px'"
      (imageSelected)="onImageSelected($event)"
    ></image-uploader>
  </div>
  <div class="grid gap-3 md:grid-cols-2">
    <div class="form__group">
      <div class="relative">
        <label for="name" class="mb-1.5 block text-sm font-semibold text-ink"
          >Class Name
          <span class="text-primary-500">*</span>
        </label>
        <input
          type="text"
          id="name"
          [ngClass]="{
            'is__invalid-input': classForm.get('name').hasError('required'),
          }"
          class="block text-md peer input-field"
          placeholder="Enter Class name "
          formControlName="name"
          required
        />
      </div>

      <div
        *ngIf="classForm.get('name').hasError('required')"
        class="is__invalid-error"
      >
        Class name is Required
      </div>
    </div>

      <div

      <div class="relative">
        <label

          class="mb-2 block text-sm font-semibold text-ink"

  </div>
  <div class="form-actions">
    <button
      (click)="cancel()"
      class="form-cancel"
    >
      Cancel
    </button>
    <button
      type="submit"
      [disabled]="classForm.invalid || classLoading() || !selectedImage"
      (click)="submit()"
      class="form-submit"
      [ngClass]="{
        'form-submit-ready':
          !classForm.invalid && !classLoading() && selectedImage,
        'form-submit-disabled': classForm.invalid || classLoading() || !selectedImage,
      }"
    >
      <svg
        *ngIf="classLoading()"
        class="-ml-1 mr-2 h-5 w-5 animate-spin text-current"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
      {{ classLoading() ? "Submitting..." : "Submit" }}
    </button>
  </div>
