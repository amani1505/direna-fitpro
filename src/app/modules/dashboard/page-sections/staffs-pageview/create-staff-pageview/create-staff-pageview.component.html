<form [formGroup]="staffForm">
  <h3
    class="mb-5 font-display text-2xl font-extrabold capitalize tracking-tight text-ink sm:text-3xl"
  >
    Add new Staff
  </h3>
  <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3">
    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink"
          >Fullname
          <span class="text-primary-500">*</span>
        </label>
        <input
          type="text"
          id="fullname"
          [ngClass]="{
            'is__invalid-input': staffForm.get('fullname').hasError('required'),
          }"
          class="block text-md peer input-field"
          placeholder="Enter Fullname "
          formControlName="fullname"
          required
        />
      </div>

      <div
        *ngIf="staffForm.get('fullname').hasError('required')"
        class="is__invalid-error"
      >
        Fullname is Required
      </div>
    </div>

    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink"
          >Email
          <span class="text-primary-500">*</span>
        </label>
        <input
          type="email"
          id="email"
          [ngClass]="{
            'is__invalid-input':
              staffForm.get('email').hasError('required') ||
              staffForm.get('email').hasError('email'),
          }"
          class="block text-md peer input-field"
          placeholder="direna@mail.com "
          formControlName="email"
        />
      </div>

      <div
        *ngIf="staffForm.get('email').hasError('required')"
        class="is__invalid-error"
      >
        Email is required
      </div>
      <div
        *ngIf="staffForm.get('email').hasError('email')"
        class="is__invalid-error"
      >
        Email must be an email address valid
      </div>
    </div>

    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink"
          >Phone Number
          <span class="text-primary-500">*</span>
        </label>
        <input
          type="text"
          id="phone"
          prefix="+255 "
          mask="(000) 000 000"
          [showMaskTyped]="true"
          [validation]="true"
          [ngClass]="{
            'is__invalid-input': staffForm.get('phone').hasError('required'),
          }"
          class="block text-md peer input-field"
          formControlName="phone"
        />
      </div>

      <div
        *ngIf="staffForm.get('phone').hasError('required')"
        class="is__invalid-error"
      >
        Phone number is required
      </div>
      <div
        *ngIf="staffForm.get('phone').hasError('mask')"
        class="is__invalid-error"
      >
        Fill all inputs for the phone number
      </div>
    </div>

    <div class="form__group">
      <label class="block text-sm font-semibold text-ink"
        >Gender <span class="text-primary-500">*</span></label
      >
      <div class="mt-2 space-x-4">
        <label class="inline-flex items-center">
          <input
            type="radio"
            formControlName="gender"
            value="male"
            class="h-5 w-5 text-primary-500"
          />
          <span class="ml-2">Male</span>
        </label>
        <label class="inline-flex items-center">
          <input
            type="radio"
            formControlName="gender"
            value="female"
            class="h-5 w-5 text-primary-500"
          />
          <span class="ml-2">Female</span>
        </label>
      </div>

      <div
        *ngIf="staffForm.get('gender').hasError('required')"
        class="is__invalid-error"
      >
        Please select a gender
      </div>
    </div>

    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink"
          >Address
          <span class="text-primary-500">*</span>
        </label>
        <input
          type="text"
          id="address"
          [ngClass]="{
            'is__invalid-input': staffForm.get('address').hasError('required'),
          }"
          class="block text-md peer input-field"
          placeholder="Enter the address "
          formControlName="address"
          required
        />
      </div>

      <div
        *ngIf="staffForm.get('address').hasError('required')"
        class="is__invalid-error"
      >
        Address is Required
      </div>
    </div>

    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink"
          >City
          <span class="text-primary-500">*</span>
        </label>
        <input
          type="text"
          id="city"
          [ngClass]="{
            'is__invalid-input': staffForm.get('city').hasError('required'),
          }"
          class="block text-md peer input-field"
          placeholder="Enter city "
          formControlName="city"
          required
        />
      </div>

      <div
        *ngIf="staffForm.get('city').hasError('required')"
        class="is__invalid-error"
      >
        City is Required
      </div>
    </div>

    <div class="form__group">
      <label class="mb-1.5 block text-sm font-semibold text-ink"
        >Branch<span class="text-primary-500">*</span></label
      >
      <SeachableSelect
        [placeholder]="'Select Branch'"
        [options]="transformBranchToSelectOptions(branches())"
        (selectionChange)="selectBranch($event)"
        [canAdd]="true"
        (onAdd)="openBranchModal()"
        [buttonLabel]="'Add New Branch'"
      ></SeachableSelect>
    </div>

    <div class="form__group">
      <label class="mb-1.5 block text-sm font-semibold text-ink"
        >Role<span class="text-primary-500">*</span></label
      >
      <SeachableSelect
        [placeholder]="'Select Role of the staff'"
        [options]="transformRoleToSelectOptions(roles())"
        (selectionChange)="selectRole($event)"
        [canAdd]="true"
        (onAdd)="openRoleModal()"
        [buttonLabel]="'Add New Role'"
      ></SeachableSelect>
    </div>
  </div>
  <div class="form-actions">
    <button
      (click)="cancel()"
      class="form-cancel"
    >
      Cancel
    </button>
    <button
      type="submit"
      [disabled]="staffForm.invalid || staffLoading() || !selectedBranch || !selectedRole"
      (click)="submit()"
      class="form-submit"
      [ngClass]="{
        'form-submit-ready':
          !staffForm.invalid && !staffLoading(),
        'form-submit-disabled': staffForm.invalid || staffLoading() || !selectedBranch || !selectRole,
      }"
    >
      <svg
        *ngIf="staffLoading()"
        class="-ml-1 mr-2 h-5 w-5 animate-spin text-current"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
      {{ staffLoading() ? "Submitting..." : "Submit" }}
    </button>
  </div>
</form>

<add-branch-modal
  [isModalOpen]="isBranchModalOpen()"
  (onCancel)="closeBranchModal()"
  [refetchString]="'getAll'"
></add-branch-modal>

<add-role-modal
  [isModalOpen]="isRoleModalOpen()"
  (onCancel)="closeRoleModal()"
  [refetchString]="'getAll'"
></add-role-modal>
