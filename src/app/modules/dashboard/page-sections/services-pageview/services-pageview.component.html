<section>
  <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div class="min-w-0">
      <h3 class="font-display text-2xl font-extrabold tracking-tight text-ink sm:text-3xl">
        Services
      </h3>
    <p class="mt-1 flex items-center gap-2 text-sm text-muted">
      <span>All services</span>
      <span class="rounded-full bg-primary-500/10 px-2 py-0.5 font-display text-xs font-bold text-primary-600 dark:text-primary-400">{{ totalItems() }}</span>
    </p>
    </div>

    <button
      type="button"
      (click)="add()"
      class="btn-pop shine w-full !px-5 !py-2.5 text-sm sm:w-auto"
    >
      <span aria-hidden="true" class="text-lg leading-none">+</span>
      Add service
    </button>
  </div>
  <div class="mb-5 w-full sm:w-80">
    <label class="relative block text-subtle">
      <span class="sr-only">Search</span>
      <span class="pointer-events-none absolute left-3 top-1/2 z-20 -translate-y-1/2">
        <svg-icon
          src="./assets/icons/heroicons/outline/magnifying-glass.svg"
          [svgClass]="'h-4 w-4'"
        ></svg-icon>
      </span>
      <input
        class="!rounded-full !py-2.5 !pl-9 !pr-4 text-sm"
        [placeholder]="'Search...'"
        type="search"
        [value]="searchTerm()"
        (input)="onSearch($event)"
      />
    </label>
  </div>

  @if (services().length === 0) {
    <div class="flex flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-line px-4 py-14 text-center text-muted">
      <span class="grid h-12 w-12 animate-pop-in place-items-center rounded-full bg-surface-2 font-display text-xl text-subtle" aria-hidden="true">✺</span>
      <p class="font-display font-bold text-ink">No services yet</p>
      <p class="text-sm">Use “Add service” to create your first service.</p>
    </div>
  }
  <div class="grid grid-cols-1 gap-4 xs:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4">
    @for (service of services(); track $index) {
      <ServiceCard [service]="service"></ServiceCard>
    }
  </div>

  @if (totalPages() > 1) {
    <div class="mt-4">
      <Pagination
        [totalPages]="totalPages()"
        [currentPage]="currentPage()"
        (pageChange)="onPageChange($event)"
      ></Pagination>
    </div>
  }
</section>

<add-service-modal
  [isModalOpen]="isServiceodalOpen()"
  (onCancel)="closeServiceModal()"
  [refetchString]="'findAll'"
></add-service-modal>
