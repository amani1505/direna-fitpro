<article
  spotlight
  class="group flex h-full flex-col overflow-hidden rounded-2xl border border-line bg-surface text-ink transition-[transform,box-shadow,border-color] duration-300 ease-out-expo hover:-translate-y-1 hover:border-primary-500/40 hover:shadow-soft animate-pop-in"
>
  <header
    class="flex items-start justify-between gap-3 border-b border-line p-4"
  >
    <div class="flex min-w-0 items-center gap-2.5">
      <span
        class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-primary-500/10 text-primary-500 transition-transform duration-500 ease-spring group-hover:-rotate-12"
      >
        <svg-icon
          src="assets/icons/heroicons/solid/wrench-screwdriver.svg"
          [svgClass]="'w-5 h-5'"
        ></svg-icon>
      </span>
      <h4 class="min-w-0 truncate font-display text-lg font-bold capitalize">
        {{ service?.name || "N/A" }}
      </h4>
    </div>
    <div class="flex shrink-0 gap-1.5">
      <button
        type="button"
        class="grid h-8 w-8 place-items-center rounded-full bg-blue-500/10 text-blue-600 transition duration-200 ease-spring hover:scale-110 hover:bg-blue-500 hover:text-white active:scale-90 dark:text-blue-400"
        (click)="openEditModal(service.id)"
        aria-label="Edit service"
      >
        <svg-icon
          src="./assets/icons/heroicons/outline/pencil.svg"
          [svgClass]="'w-4 h-4'"
        ></svg-icon>
      </button>
      <button
        type="button"
        class="grid h-8 w-8 place-items-center rounded-full bg-rose-500/10 text-rose-600 transition duration-200 ease-spring hover:scale-110 hover:bg-rose-500 hover:text-white active:scale-90 dark:text-rose-400"
        (click)="openDeleteModal()"
        aria-label="Delete service"
      >
        <svg-icon
          src="./assets/icons/heroicons/outline/trash.svg"
          [svgClass]="'w-4 h-4'"
        ></svg-icon>
      </button>
    </div>
  </header>

  <div class="flex grow flex-col gap-4 p-4">
    <ul class="space-y-2.5 text-sm">
      <li class="flex items-start gap-2.5">
        <span
          class="grid h-7 w-7 shrink-0 place-items-center rounded-lg bg-surface-2 text-muted"
        >
          <svg-icon
            src="./assets/icons/heroicons/solid/check-badge.svg"
            [svgClass]="'w-4 h-4'"
          ></svg-icon>
        </span>
        <span class="min-w-0 break-words pt-0.5">{{
          service?.description || "N/A"
        }}</span>
      </li>
    </ul>

    <dl
      class="mt-auto grid grid-cols-2 gap-3 border-t border-dashed border-line pt-3 text-xs"
    >
      <div>
        <dt class="text-subtle">Created</dt>
        <dd class="font-semibold">
          {{
            $safeNavigationMigration(service?.created_at) | date: "mediumDate"
          }}
        </dd>
      </div>
      <div>
        <dt class="text-subtle">Updated</dt>
        <dd class="font-semibold">
          {{
            $safeNavigationMigration(service?.updated_at) | date: "mediumDate"
          }}
        </dd>
      </div>
    </dl>
  </div>
</article>

<Modal
  [isOpen]="isDeleteModalOpen()"
  (closeModalEvent)="closeDeleteModal()"
  [title]="'Delete Confirmation'"
  [content]="deleteContent"
  [subContent]="deleteSubContent"
  (submit)="delete()"
></Modal>

@if (isServiceModalOpen() && service.id === serviceId()) {
  <edit-service
    [service]="service"
    [isModalOpen]="isServiceModalOpen()"
    (onCancel)="closeEditModal()"
    [refetchString]="'findAll'"
  ></edit-service>
}
