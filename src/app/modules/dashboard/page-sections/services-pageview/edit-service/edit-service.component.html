<ReusableModal
  [isOpen]="isModalOpen()"
  [config]="modalConfig"
  (closeModalEvent)="cancel()"
>
  <!-- Custom header -->
  <ng-container modalHeader>
    <h2 class="ms-2 font-display text-xl font-bold text-ink">
      Add New Service
    </h2>
  </ng-container>

  <!-- Modal content -->
  <ng-container modalContent>
    <form [formGroup]="editServiceForm">
      <div class="mb-3 form__group">
        <div class="relative">
          <label class="mb-2 block text-sm font-semibold text-ink"
            >Title
            <span class="text-primary-500">*</span>
          </label>
          <input
            type="text"
            id="fullname"
            class="block text-md peer input-field"
            placeholder="Enter service name "
            [ngClass]="{
              'is__invalid-input': editServiceForm
                .get('name')
                .hasError('required'),
            }"
            formControlName="name"
          />
        </div>
        @if (editServiceForm.get("name").hasError("required")) {
          <div class="is__invalid-error">service name is Required</div>
        }
      </div>

      <div class="form__group">
        <div class="relative">
          <label class="mb-2 block text-sm font-semibold text-ink"
            >Description

            <span class="text-primary-500">*</span>
          </label>
          <textarea
            rows="3"
            [ngClass]="{
              'is__invalid-input': editServiceForm
                .get('description')
                .hasError('required'),
            }"
            formControlName="description"
          ></textarea>
        </div>
        @if (editServiceForm.get("description").hasError("required")) {
          <div class="is__invalid-error">service description is required</div>
        }
      </div>
    </form>
  </ng-container>
  <ng-container modalFooter>
    <div class="form-actions">
      <button type="submit" (click)="cancel()" class="form-cancel">
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="editServiceForm.invalid || loading()"
        (click)="submit()"
        class="form-submit"
        [ngClass]="{
          'form-submit-ready': !editServiceForm.invalid && !loading(),
          'form-submit-disabled': editServiceForm.invalid || loading(),
        }"
      >
        @if (loading()) {
          <svg
            class="-ml-1 mr-2 h-5 w-5 animate-spin text-current"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
        }
        {{ loading() ? "Submitting..." : "Submit" }}
      </button>
    </div>
  </ng-container>
</ReusableModal>
