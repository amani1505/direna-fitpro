<form [formGroup]="memberForm">
  <h3
    class="mb-5 font-display text-2xl font-extrabold capitalize tracking-tight text-ink sm:text-3xl"
  >
    Add new member
  </h3>
  <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3">
    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink"
          >Fullname
          <span class="text-primary-500">*</span>
        </label>
        <input
          type="text"
          id="fullname"
          [ngClass]="{
            'is__invalid-input': memberForm
              .get('fullname')
              .hasError('required'),
          }"
          class="block text-md peer input-field"
          placeholder="Enter Fullname "
          formControlName="fullname"
          required
        />
      </div>

      <div
        *ngIf="memberForm.get('fullname').hasError('required')"
        class="is__invalid-error"
      >
        Fullname is Required
      </div>
    </div>

    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink"
          >Email
          <span class="text-primary-500">*</span>
        </label>
        <input
          type="email"
          id="email"
          [ngClass]="{
            'is__invalid-input':
              memberForm.get('email').hasError('required') ||
              memberForm.get('email').hasError('email'),
          }"
          class="block text-md peer input-field"
          placeholder="direna@mail.com "
          formControlName="email"
        />
      </div>

      <div
        *ngIf="memberForm.get('email').hasError('required')"
        class="is__invalid-error"
      >
        Email is required
      </div>
      <div
        *ngIf="memberForm.get('email').hasError('email')"
        class="is__invalid-error"
      >
        Email must be an email address valid
      </div>
    </div>

    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink"
          >Phone Number
          <span class="text-primary-500">*</span>
        </label>
        <input
          type="text"
          id="phone"
          prefix="+255 "
          mask="(000) 000 000"
          [showMaskTyped]="true"
          [validation]="true"
          [ngClass]="{
            'is__invalid-input': memberForm.get('phone').hasError('required'),
          }"
          class="block text-md peer input-field"
          formControlName="phone"
        />
      </div>

      <div
        *ngIf="memberForm.get('phone').hasError('required')"
        class="is__invalid-error"
      >
        Phone number is required
      </div>
      <div
        *ngIf="memberForm.get('phone').hasError('mask')"
        class="is__invalid-error"
      >
        Fill all inputs for the phone number
      </div>
    </div>

    <div class="form__group">
      <label class="block text-sm font-semibold text-ink"
        >Gender <span class="text-primary-500">*</span></label
      >
      <div class="mt-2 space-x-4">
        <label class="inline-flex items-center">
          <input
            type="radio"
            formControlName="gender"
            value="male"
            class="h-5 w-5 text-primary-500"
          />
          <span class="ml-2">Male</span>
        </label>
        <label class="inline-flex items-center">
          <input
            type="radio"
            formControlName="gender"
            value="female"
            class="h-5 w-5 text-primary-500"
          />
          <span class="ml-2">Female</span>
        </label>
      </div>

      <div
        *ngIf="memberForm.get('gender').hasError('required')"
        class="is__invalid-error"
      >
        Please select a gender
      </div>
    </div>
    <div class="form__group">
      <label class="mb-1.5 block text-sm font-semibold text-ink"
        >Services<span class="text-primary-500">*</span></label
      >
      <MultiSelect
        [placeholder]="'Select the Services'"
        [options]="transformToMultiSelectOptions(services())"
        (selectionChange)="selectService($event)"
        [canAdd]="true"
        (onAdd)="openServiceModal()"
        [buttonLabel]="'Add New Service'"
      ></MultiSelect>
    </div>

    <div class="form__group">
      <label class="mb-1.5 block text-sm font-semibold text-ink"
        >Branch<span class="text-primary-500">*</span></label
      >
      <SeachableSelect
        [placeholder]="'Select Branch'"
        [options]="transformToSelectOptions(branches())"
        (selectionChange)="selectBranch($event)"
        [canAdd]="true"
        (onAdd)="openBranchModal()"
        [buttonLabel]="'Add New Branch'"
      ></SeachableSelect>
    </div>

    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink"
          >Weight <span class="text-primary-500">*</span></label
        >
        <input
          type="text"
          id="weight"
          suffix=" kg"
          mask="0000"
          [validation]="false"
          [ngClass]="{
            'is__invalid-input': memberForm.get('weight').hasError('required'),
          }"
          class="block text-md peer input-field"
          placeholder="Enter the weight"
          formControlName="weight"
        />
      </div>

      <div
        *ngIf="memberForm.get('weight').hasError('required')"
        class="is__invalid-error"
      >
        Weight field is Required
      </div>
    </div>

    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink">Age</label>
        <input
          type="number"
          id="age"
          class="block text-md peer input-field"
          formControlName="age"
        />
      </div>
    </div>

    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink"
          >Height</label
        >
        <input
          type="text"
          id="height"
          suffix=" cm"
          class="block text-md peer input-field"
          placeholder="Enter Height "
          formControlName="height"
        />
      </div>
    </div>
    <div class="form__group">
      <div class="relative">
        <label class="mb-1.5 block text-sm font-semibold text-ink"
          >Goal <span class="text-primary-500">*</span></label
        >
        <input
          type="text"
          id="goal"
          [ngClass]="{
            'is__invalid-input': memberForm.get('goal').hasError('required'),
          }"
          class="block text-md peer input-field"
          placeholder="Enter Goal "
          formControlName="goal"
        />
      </div>

      <div
        *ngIf="memberForm.get('goal').hasError('required')"
        class="is__invalid-error"
      >
        Goal Field is Required
      </div>
    </div>
  </div>
  <div class="form-actions">
    <button
      (click)="cancel()"
      class="form-cancel"
    >
      Cancel
    </button>
    <button
      type="submit"
      [disabled]="
        memberForm.invalid ||
        memberLoading() ||
        selectedServices.length === 0 ||
        !selectedBranch
      "
      (click)="submit()"
      class="form-submit"
      [ngClass]="{
        'form-submit-ready':
          !memberForm.invalid &&
          !memberLoading() &&
          selectedServices.length > 0 &&
          selectedBranch,
        'form-submit-disabled':
          memberForm.invalid ||
          memberLoading() ||
          selectedServices.length === 0 ||
          !selectedBranch,
      }"
    >
      <svg
        *ngIf="memberLoading()"
        class="-ml-1 mr-2 h-5 w-5 animate-spin text-current"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
      {{ memberLoading() ? "Submitting..." : "Submit" }}
    </button>
  </div>
</form>
<add-service-modal
  [isModalOpen]="isServiceModalOpen()"
  (onCancel)="closeServiceModal()"
  [refetchString]="'getAll'"
></add-service-modal>
<add-branch-modal
  [isModalOpen]="isBranchModalOpen()"
  (onCancel)="closeBranchModal()"
  [refetchString]="'getAll'"
></add-branch-modal>
