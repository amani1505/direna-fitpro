<div class="grid grid-cols-1 gap-3 xs:grid-cols-2 lg:grid-cols-3">
  @for (stat of dashboardStats; track $index) {
    <div
      spotlight
      class="stat-card group flex flex-col justify-between overflow-hidden rounded-2xl border border-line bg-surface p-4 transition-[transform,box-shadow,border-color] duration-300 ease-out-expo hover:-translate-y-1 hover:shadow-soft animate-pop-in"
      [style.animation-delay.ms]="$index * 70"
      [ngClass]="accent(stat.title).border"
    >
      <div>
        <div class="flex items-center gap-2.5">
          <div
            class="grid h-10 w-10 place-items-center rounded-xl transition-transform duration-500 ease-spring group-hover:-rotate-12 group-hover:scale-110"
            [ngClass]="accent(stat.title).chip"
          >
            <svg-icon [src]="stat.icon" [svgStyle]="{ 'width.px': 22 }"></svg-icon>
          </div>
          <div class="font-display text-lg font-bold" [ngClass]="accent(stat.title).text">
            {{ stat.title }}
          </div>
        </div>
        <p class="mt-2 text-sm text-muted">{{ stat.subtitle }}</p>
      </div>

      <div class="mt-4 flex items-end justify-between gap-2">
        <h3 class="font-display text-4xl font-extrabold leading-none tracking-tight text-ink">
          {{ stat.count }}
        </h3>
        <a
          [routerLink]="[stat.link]"
          class="inline-flex items-center gap-1 rounded-full bg-surface-2 px-3 py-1.5 text-xs font-semibold text-ink transition hover:bg-primary-500 hover:text-white"
          [attr.aria-label]="'View all ' + stat.title"
        >
          View all
          <span aria-hidden="true" class="transition-transform duration-300 group-hover:translate-x-0.5">›</span>
        </a>
      </div>
    </div>
  }
</div>
