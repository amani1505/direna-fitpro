<section class="py-3">
  <div class="mb-5 animate-rise">
    <h1 class="font-display text-2xl font-extrabold tracking-tight text-ink sm:text-3xl">
      {{ greeting }}<span class="text-primary-500">{{
        (user?.profile?.first_name ?? "") + " " + (user?.profile?.last_name ?? "")
      }}</span>
    </h1>
    <p class="mt-1 text-sm text-muted">An overview of your branches, services, members and equipment.</p>
  </div>
  <div class="grid grid-cols-1 gap-4 xl:grid-cols-12">
    <div class="min-w-0 space-y-4 xl:col-span-8">
      <header-cards [dashboardStats]="dashboardStatstics()"></header-cards>
      <dashboard-equipment [equipments]="equipments()"></dashboard-equipment>
    </div>
    <div class="grid min-w-0 grid-cols-1 content-start gap-4 md:grid-cols-2 xl:col-span-4 xl:grid-cols-1">
      <dashboard-branches [branches]="branches()"></dashboard-branches>
      <dashboard-services [services]="services()"></dashboard-services>
    </div>
  </div>
</section>
