<section class="animate-pop-in rounded-2xl border border-line bg-surface p-5 [animation-delay:200ms]">
  <div class="flex items-center justify-between mb-3">
    <h2 class="font-display text-lg font-bold text-ink">Services</h2>
    <a
    [routerLink]="['/admin/services']"
      class="rounded-full px-3 py-1 text-sm font-semibold text-primary-500 transition hover:bg-primary-500 hover:text-white"
      >view all</a
    >
  </div>
@for (service of services; track $index) {
  <div
  class="mb-2 rounded-xl border border-line bg-surface-2/50 text-ink transition duration-300 hover:translate-x-1 hover:border-primary-500/40"
>
  <div
    class="flex items-center justify-between p-3 font-[500] capitalize text-md font-rubik"
  >
    <div class="flex items-end gap-1">
      <div>
        <svg-icon
          src="assets/icons/heroicons/solid/wrench-screwdriver.svg"
          [svgClass]="'w-4 h-4 text-primary-500'"
          class="inline-block"
        >
        </svg-icon>
      </div>
      <div>{{service?.name}}</div>
    </div>
  </div>

  <div class="p-3">
    <div class="flex gap-x-1">
      <div
        class="flex items-center justify-center w-6 h-6 text-green-500 bg-green-100 rounded-md"
      >
        <svg-icon
          src="./assets/icons/heroicons/solid/check-badge.svg"
          [svgClass]="'w-4 h-4 '"
          class="inline-block"
        ></svg-icon>
      </div>
      <div>{{service?.description}}</div>
    </div>

  </div>
</div>
}
</section>
