<div class="grid grid-cols-1 gap-5 lg:grid-cols-[minmax(0,1fr)_23rem]" aria-label="Loading your cart" aria-busy="true">
  <div class="space-y-3 rounded-[2rem] border border-line bg-surface p-5">
    <div class="skeleton h-7 w-28"></div>
    @for (row of [1, 2, 3]; track row) {
      <div class="flex items-center gap-4 py-3">
        <div class="skeleton h-20 w-20 shrink-0 rounded-2xl"></div>
        <div class="grow space-y-2">
          <div class="skeleton h-4 w-1/2"></div>
          <div class="skeleton h-4 w-1/4"></div>
        </div>
      </div>
    }
  </div>
  <div class="space-y-4 rounded-[2rem] border border-line bg-surface p-6">
    <div class="skeleton h-7 w-40"></div>
    <div class="skeleton h-4 w-full"></div>
    <div class="skeleton h-4 w-full"></div>
    <div class="skeleton mt-6 h-12 w-full rounded-full"></div>
  </div>
</div>
