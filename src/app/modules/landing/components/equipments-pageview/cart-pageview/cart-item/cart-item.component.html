@if (product?.equipment; as eq) {
  <div class="flex gap-3 px-1 py-4 sm:gap-4 sm:px-2">
    <a [routerLink]="['/equipments', eq.id]" class="block h-20 w-20 shrink-0 overflow-hidden rounded-2xl bg-[#f3f1f7] sm:h-24 sm:w-24">
      @if (eq.files?.[0]?.file_path) {
        <img [src]="fileUrl + eq.files[0].file_path" [alt]="eq.title" class="h-full w-full object-contain p-2 mix-blend-multiply" />
      }
    </a>

    <div class="flex min-w-0 grow flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="min-w-0">
        <a [routerLink]="['/equipments', eq.id]" class="line-clamp-2 font-display font-bold leading-snug text-ink hover:text-primary-500 sm:text-lg">
          {{ eq.title }}
        </a>
        <p class="mt-0.5 text-sm text-muted">{{ eq.price | number: "1.0-2" }} TZS each</p>
      </div>

      <div class="flex items-center justify-between gap-4 sm:justify-end">
        <!-- Quantity stepper -->
        <div class="stepper" role="group" [attr.aria-label]="'Quantity of ' + eq.title">
          <button
            type="button"
            class="stepper-btn"
            [disabled]="busy"
            [attr.aria-label]="product.quantity <= 1 ? 'Remove ' + eq.title : 'One less'"
            (click)="onDecrement(product)"
          >
            −
          </button>
          <span class="min-w-[2ch] text-center font-display font-bold tabular-nums text-ink" aria-live="polite">{{ product.quantity }}</span>
          <button
            type="button"
            class="stepper-btn"
            [disabled]="busy || product.quantity >= eq.quantity"
            aria-label="One more"
            [title]="product.quantity >= eq.quantity ? 'No more in stock' : 'One more'"
            (click)="onIncrement(product)"
          >
            +
          </button>
        </div>

        <p class="min-w-0 text-right font-display font-extrabold tabular-nums text-ink sm:w-28 sm:text-lg">
          {{ eq.price * product.quantity | number: "1.0-2" }}
          <span class="block text-xs font-semibold text-muted">TZS</span>
        </p>

        <button
          type="button"
          class="grid h-9 w-9 shrink-0 place-items-center rounded-full text-muted transition hover:bg-rose-500 hover:text-white active:scale-90 disabled:opacity-40"
          [disabled]="busy"
          [attr.aria-label]="'Remove ' + eq.title + ' from cart'"
          title="Remove"
          (click)="onRemove(product)"
        >
          <svg-icon src="assets/icons/heroicons/outline/trash.svg" [svgClass]="'h-[18px] w-[18px]'"></svg-icon>
        </button>
      </div>
    </div>
  </div>
}
