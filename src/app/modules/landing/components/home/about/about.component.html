<section class="section about" id="about" aria-label="about">
  @if (about) {
    <div class="container">
      <div class="about-banner has-after" reveal="left">
        <img
          src="{{ about.image }}"
          width="660"
          height="648"
          loading="lazy"
          alt="Coach training a member"
          class="w-100"
        />

        <img
          src="./assets/images/about-circle-one.png"
          width="660"
          height="534"
          loading="lazy"
          aria-hidden="true"
          alt=""
          class="circle circle-1"
        />
        <img
          src="./assets/images/about-circle-two.png"
          width="660"
          height="534"
          loading="lazy"
          aria-hidden="true"
          alt=""
          class="circle circle-2"
        />

        <img
          src="./assets/images/fitness.png"
          width="650"
          height="154"
          loading="lazy"
          alt="fitness"
          class="abs-img w-100"
        />
      </div>

      <div class="about-content" reveal="right" [revealDelay]="120">
        <p class="section-subtitle">About us</p>

        <h2
          class="hero-title font-display text-3xl font-extrabold leading-[1.05] tracking-tight text-[var(--rich-black-fogra-29-1)] sm:text-4xl xl:text-[3.25rem]"
        >
          {{ about.title }}
        </h2>

        <p class="mb-4 leading-relaxed">
          {{ about.description }}
        </p>

        <p class="leading-relaxed">
          {{ about.subDescription }}
        </p>

        <div class="wrapper">
          <div class="about-coach">
            <figure class="coach-avatar">
              <img
                src="{{ about.ownerImage }}"
                width="65"
                height="65"
                loading="lazy"
                alt="Trainer"
              />
            </figure>

            <div class="">
              <h3
                class="coach-name font-display text-lg font-bold leading-tight text-[var(--rich-black-fogra-29-1)]"
              >
                {{ about.ownerName }}
              </h3>

              <p
              class="coach-title"
              >
                {{ about.ownerPosition }}
              </p>
            </div>
          </div>

          <a
           [routerLink]="['/about']"
            class="btn-pop shine"
            >Explore more</a
          >
        </div>
      </div>
    </div>
  }
</section>
