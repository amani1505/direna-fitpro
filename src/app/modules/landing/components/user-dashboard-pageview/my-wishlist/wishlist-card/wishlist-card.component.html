<article class="wish-card group">
  <div class="relative aspect-[4/3] overflow-hidden rounded-[1.1rem] bg-surface-2">
    @if (image) {
      <img
        [src]="fileUrl + image"
        [alt]="wishlist?.equipment?.title"
        loading="lazy"
        class="h-full w-full object-cover transition-transform duration-700 ease-out-expo group-hover:scale-105"
      />
    } @else {
      <div class="grid h-full w-full place-items-center text-subtle">
        <svg-icon src="./assets/icons/heroicons/outline/photo.svg" [svgClass]="'h-10 w-10'"></svg-icon>
      </div>
    }
    <button
      type="button"
      class="absolute right-2.5 top-2.5 grid h-9 w-9 place-items-center rounded-full bg-white/90 text-rose-500 shadow-soft backdrop-blur transition duration-300 ease-spring hover:scale-110 hover:bg-rose-500 hover:text-white active:scale-90"
      [attr.aria-label]="'Remove ' + (wishlist?.equipment?.title || 'item') + ' from wishlist'"
      title="Remove from wishlist"
      (click)="onRemovwFromWishlist(wishlist?.id)"
    >
      <svg-icon src="assets/icons/heroicons/outline/trash.svg" [svgClass]="'h-4 w-4'"></svg-icon>
    </button>
  </div>

  <div class="flex grow flex-col px-1.5 pb-1 pt-3">
    <h3 class="line-clamp-2 font-display text-lg font-bold leading-snug text-ink">
      {{ wishlist?.equipment?.title }}
    </h3>
    <p class="mt-1 font-display text-base font-bold tabular-nums text-primary-500">
      {{ wishlist?.equipment?.price | number: "1.0-2" }} <span class="text-xs font-semibold text-muted">TZS</span>
    </p>
    <button
      type="button"
      class="mt-4 inline-flex w-full items-center justify-center gap-2 rounded-full border-2 border-ink bg-ink px-4 py-2.5 font-display text-sm font-bold text-bg transition duration-200 hover:bg-primary-500 hover:border-primary-500 hover:text-white active:scale-[0.97]"
      (click)="onAddToCart(wishlist?.equipment?.id)"
    >
      <svg-icon src="./assets/icons/heroicons/outline/shopping-cart.svg" [svgClass]="'h-4 w-4'"></svg-icon>
      Add to cart
    </button>
  </div>
</article>
