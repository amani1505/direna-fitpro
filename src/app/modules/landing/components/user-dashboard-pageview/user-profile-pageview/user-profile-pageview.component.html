<div
  class="profile-tabs"
  role="tablist"
  aria-label="Profile sections"
>
  @for (tab of tabs; track tab.value) {
    <button
      type="button"
      role="tab"
      class="profile-tab"
      [id]="'tab-' + tab.value"
      [class.is-active]="activeTab === tab.value"
      [attr.aria-selected]="activeTab === tab.value"
      [attr.aria-controls]="'panel-' + tab.value"
      (click)="setActiveTab(tab.value)"
    >
      <svg-icon [src]="tab.icon" [svgClass]="'h-4 w-4'"></svg-icon>
      {{ tab.title }}
    </button>
  }
</div>

<div
  class="mt-6"
  role="tabpanel"
  [id]="'panel-' + activeTab"
  [attr.aria-labelledby]="'tab-' + activeTab"
>
  @switch (activeTab) {
    @case ("personal") {
      <div class="animate-fade-in-up"><personal-information [user]="user?.profile"></personal-information></div>
    }
    @case ("addresses") {
      <div class="animate-fade-in-up"><personal-address></personal-address></div>
    }
    @case ("security") {
      <div class="animate-fade-in-up"><personal-security></personal-security></div>
    }
  }
</div>
