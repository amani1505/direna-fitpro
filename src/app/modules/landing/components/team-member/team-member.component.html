<article
  class="group relative isolate aspect-[4/5] overflow-hidden rounded-3xl bg-surface-2 transition-transform duration-500 ease-out-expo hover:-translate-y-1.5 hover:-rotate-1"
>
  <img
    class="absolute inset-0 -z-10 h-full w-full object-cover transition-transform duration-[1.1s] ease-out-expo group-hover:scale-110"
    [src]="imageUrl"
    [alt]="name"
    loading="lazy"
  />
  <div
    aria-hidden="true"
    class="absolute inset-0 -z-10 bg-gradient-to-t from-[rgb(24_19_34/0.9)] via-[rgb(24_19_34/0.15)] to-transparent"
  ></div>

  <div class="flex h-full flex-col justify-end p-5 text-white">
    <span
      class="mb-3 inline-flex w-max -rotate-2 rounded-full bg-primary-500 px-3 py-1 text-xs font-bold transition-transform duration-500 ease-spring group-hover:rotate-0 group-hover:scale-105"
      >{{ role }}</span
    >
    <h3 class="font-display text-2xl font-extrabold tracking-tight">{{ name }}</h3>
  </div>
</article>
