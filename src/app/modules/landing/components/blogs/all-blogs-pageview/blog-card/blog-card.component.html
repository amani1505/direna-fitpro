<article class="post-card group">
  <a [routerLink]="['/blogs', blog.id]" class="flex h-full flex-col">
    <div class="relative aspect-[16/10] overflow-hidden rounded-[1.25rem] bg-surface-2">
      <img
        [src]="blog.image"
        [alt]="blog.title"
        loading="lazy"
        class="h-full w-full object-cover transition-transform duration-700 ease-out-expo group-hover:scale-105"
      />
      <span class="absolute left-3 top-3 rounded-full bg-surface/90 px-3 py-1 text-xs font-bold text-ink backdrop-blur">
        {{ blog.category }}
      </span>
    </div>
    <div class="flex grow flex-col px-2 pb-2 pt-4">
      <p class="text-sm text-muted">
        <time [attr.datetime]="blog.date">{{ blog.date | date: "mediumDate" }}</time> · {{ blog.readMinutes }} min read
      </p>
      <h3 class="mt-2 font-display text-xl font-bold leading-snug tracking-tight text-ink sm:text-2xl">
        {{ blog.title }}
      </h3>
      <p class="mt-2 line-clamp-2 text-muted">{{ blog.excerpt }}</p>
      <span class="mt-auto inline-flex items-center gap-2 pt-5 font-display text-sm font-bold text-ink">
        Read article
        <span aria-hidden="true" class="transition-transform duration-300 group-hover:translate-x-1">→</span>
      </span>
    </div>
  </a>
</article>
