<!-- Scroll progress -->
<div
  aria-hidden="true"
  class="fixed left-0 top-0 z-[1001] h-1 origin-left bg-gradient-to-r from-primary-500 via-primary-400 to-secondary-400 transition-transform duration-150"
  [style.transform]="'scaleX(' + scrollProgress / 100 + ')'"
  style="width: 100%"
></div>

<app-navbar [isScrolled]="isScrolled"></app-navbar>

<main>
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>

<button
  type="button"
  aria-label="Back to top"
  class="fixed bottom-5 right-5 z-[998] grid h-12 w-12 place-items-center rounded-full border-2 border-ink bg-primary-500 text-white shadow-pop transition-all duration-500 ease-spring hover:-translate-y-1 active:translate-x-0.5 active:translate-y-0.5 active:shadow-none"
  [ngClass]="isScrolled ? 'translate-y-0 opacity-100' : 'pointer-events-none translate-y-20 opacity-0'"
  (click)="backToTheTop()"
>
  <svg-icon
    src="./assets/icons/play.svg"
    [svgClass]="'h-5 w-5 -rotate-90'"
  ></svg-icon>
</button>
